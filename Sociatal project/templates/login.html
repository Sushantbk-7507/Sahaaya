{% extends "base.html" %}

{% block title %}Supporter Login – Sahaaya{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="surface-card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <span class="need-icon mx-auto mb-3"><i class="fa-solid fa-user-check"></i></span>
                        <h1 class="h3 section-heading mb-1">Supporter Login</h1>
                        <p class="text-secondary small mb-0">Sign in to send and track direct support inquiries.</p>
                    </div>

                    <form method="POST" action="{{ url_for('login', next=request.args.get('next', '')) }}" class="needs-validation" novalidate>
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label for="loginEmail" class="form-label fw-semibold">Email Address</label>
                            <input type="email" id="loginEmail" name="email" value="{{ email or '' }}" class="form-control" required autofocus>
                            <div class="invalid-feedback">Please enter your email address.</div>
                        </div>
                        <div class="mb-4">
                            <label for="loginPassword" class="form-label fw-semibold">Password</label>
                            <input type="password" id="loginPassword" name="password" class="form-control" required>
                            <div class="invalid-feedback">Please enter your password.</div>
                        </div>
                        <button type="submit" class="btn btn-navy w-100 py-2">
                            <i class="fa-solid fa-right-to-bracket me-2"></i>Login to Dashboard
                        </button>
                    </form>

                    <div class="text-center mt-4 pt-3 border-top small">
                        <span class="text-secondary">New to Sahaaya?</span>
                        <a href="{{ url_for('register') }}" class="fw-semibold">Create a Supporter Account</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
