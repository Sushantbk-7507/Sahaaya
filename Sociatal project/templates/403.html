{% extends "base.html" %}
{% block title %}Access Denied (403) – Sahaaya{% endblock %}
{% block content %}
<section class="py-5">
    <div class="container text-center">
        <div class="surface-card p-5 mx-auto" style="max-width: 560px;">
            <div class="display-4 fw-bold text-danger mb-2">403</div>

        </div>
    </div>

{% endblock %}
